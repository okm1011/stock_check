<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stock_check · 대세 / 알트</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>

  <header class="glass top">
    <div class="brand">
      <p class="kicker">Binance USDT-M</p>
      <h1>stock_check</h1>
      <p class="sub">대세판단 · 알트 섹터 워치리스트</p>
    </div>
    <div class="status" id="status">시세 불러오는 중…</div>
  </header>

  <section class="glass toolbar">
    <label>
      기간
      <select id="period">
        {% for p in periods %}
        <option value="{{ p }}" {% if p == default_period %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="grow">
      검색
      <input id="q" type="search" placeholder="심볼 / 메모" autocomplete="off" />
    </label>
    <label>
      정렬
      <select id="sort">
        <option value="change_desc">변동↓</option>
        <option value="change_asc">변동↑</option>
        <option value="volume_desc">거래대금↓</option>
        <option value="symbol">심볼</option>
      </select>
    </label>
    <label>
      내 태그
      <select id="catFilter">
        <option value="">전체</option>
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </label>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>1. 대세판단</h2>
      <p>유가 · SOXL · 나스닥 · BTC · ETH · SOL</p>
    </div>
    <div class="macro-grid" id="macro"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>2. 알트코인</h2>
      <p id="altMeta">중간값 변동 · 상승 종목 비율</p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="glass table-wrap">
      <table>
        <thead>
          <tr>
            <th class="num">#</th>
            <th>심볼</th>
            <th>섹터</th>
            <th class="num">현재가</th>
            <th class="num">변동</th>
            <th class="num">24h 대금</th>
            <th>태그</th>
            <th>메모</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="empty">데이터 대기 중</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    window.STOCK_CHECK = {
      pollInterval: {{ poll_interval }},
      categories: {{ categories | tojson }},
      sectors: {{ sectors | tojson }},
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
